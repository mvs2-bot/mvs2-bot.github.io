<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mvs2 · Farbarchitektur & Design-Token</title>
<meta name="description" content="Automatische Live-Übersicht aller Repository-Farbkonzepte aus shared/style.css oder index.html">
<meta name="theme-color" content="#f2f2f7">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shared/overall-account.js"></script>
<script>
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('overall-theme') || localStorage.getItem('dash-theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root {
    --bg: #f2f2f7; --card: #fff; --well: #f2f2f7; --hover: #e9e9ef; --line: #e2e2e7; --sep: rgba(60, 60, 67, .14);
    --ink: #1c1c1e; --text: #3a3a3c; --mute: #6c6c70;
    --p1: #0066cc; --p1-soft: #e6f0fd; --on-p1: #fff;
    --ok: #248a3d; --ok-soft: #e4f5e9; --danger: #d70015; --danger-soft: #ffe6e8; --star: #b25000;
    --radius: 18px; --radius-s: 12px; --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 4px 14px rgba(0, 0, 0, .04);
    --pop: 0 12px 40px rgba(0, 0, 0, .18), 0 0 0 .5px rgba(0, 0, 0, .06);
    --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro", system-ui, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color-scheme: light;
  }
  [data-theme="dark"] {
    color-scheme: dark; --bg: #000; --card: #1c1c1e; --well: #2c2c2e; --hover: #3a3a3c; --line: #38383a; --sep: rgba(84, 84, 88, .55);
    --ink: #f5f5f7; --text: #d1d1d6; --mute: #98989f;
    --p1: #409cff; --p1-soft: #0b2540; --on-p1: #001a33;
    --ok: #30d158; --ok-soft: #0f2a17; --danger: #ff6961; --danger-soft: #3a1412; --star: #ffb340;
    --shadow: none; --pop: 0 16px 48px rgba(0, 0, 0, .6), 0 0 0 .5px rgba(255, 255, 255, .08);
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; font-family: var(--font); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.45; }
  header { position: sticky; top: 0; z-index: 20; padding-top: env(safe-area-inset-top, 0px); background: color-mix(in srgb, var(--bg) 82%, transparent); -webkit-backdrop-filter: saturate(1.8) blur(18px); backdrop-filter: saturate(1.8) blur(18px); border-bottom: 1px solid var(--sep); }
  .bar { display: flex; align-items: center; gap: 12px; padding-block: 12px 10px; max-width: 1080px; margin: 0 auto; padding-inline: 16px; }
  .back-btn { width: 36px; height: 36px; border-radius: 50%; border: 0; background: var(--card); color: var(--ink); box-shadow: var(--shadow); display: inline-grid; place-items: center; text-decoration: none; transition: background .15s; cursor: pointer; }
  .back-btn:hover { background: var(--hover); }
  .bar .head { flex: 1; min-width: 0; }
  h1 { margin: 0; font-size: 18px; font-weight: 700; color: var(--ink); line-height: 1.2; }
  .sub { font-size: 12px; color: var(--mute); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; margin-bottom: 16px; }
  .table-container { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
  th { background: var(--well); color: var(--mute); font-weight: 600; padding: 10px 12px; border-bottom: 1px solid var(--sep); text-transform: uppercase; font-size: 11px; letter-spacing: .05em; }
  td { padding: 12px; border-bottom: 1px solid var(--sep); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
  .repo-card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; justify-content: space-between; gap: 12px; }
  .badge { display: inline-flex; align-items: center; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 600; background: var(--well); color: var(--mute); }
  .ic { width: 16px; height: 16px; stroke-width: 1.8; stroke: currentColor; fill: none; }
</style>
<script src="shared/ios-nav.js" defer></script>
</head>
<body>

<header>
  <div class="bar">
    <a class="back-btn" href="./" aria-label="Zurück zum Dashboard" title="Zurück">
      <svg class="ic" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
    </a>
    <div class="head">
      <h1>Farbarchitektur & Design-Token</h1>
      <div class="sub">Live-Parser aus shared/style.css oder index.html</div>
    </div>
    <button class="back-btn" id="themeBtn" type="button" aria-label="Dark Mode"></button>
  </div>
</header>

<main class="wrap">
  <div class="card" style="display: flex; justify-content: space-between; align-items: center;">
    <div>
      <div style="font-weight: 600; color: var(--ink);">Quellcode-Live-Sync</div>
      <div style="font-size: 12px; color: var(--mute);" id="statusText">Prüfe shared/style.css & index.html...</div>
    </div>
    <button class="back-btn" onclick="loadLiveTokens()" style="width: auto; padding: 0 14px; border-radius: 10px; font-size: 12px; font-weight: 600;" type="button">Neu laden</button>
  </div>

  <div class="card" style="padding: 0; overflow: hidden;">
    <div style="padding: 16px 16px 12px; font-weight: 600; font-size: 15px; border-bottom: 1px solid var(--sep);">Design-Token Matrix (--p1 Live)</div>
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Repository</th>
            <th>Primär-Akzent Light (--p1)</th>
            <th>Primär-Akzent Dark (--p1)</th>
            <th>Quelle / Status</th>
          </tr>
        </thead>
        <tbody id="matrixTable">
          <!-- Dynamisch -->
        </tbody>
      </table>
    </div>
  </div>

  <div style="font-weight: 600; font-size: 16px; margin: 24px 0 12px;">Repository Farb-Anatomie</div>
  <div class="grid" id="cardsGrid">
    <!-- Dynamisch -->
  </div>
</main>

<script>
  const repos = [
    { name: "Spitznamensuche-Camper", slug: "Spitznamensuche-Camper" },
    { name: "TravelBase", slug: "TravelBase" },
    { name: "RealWorld-QuestLog", slug: "RealWorld-QuestLog" },
    { name: "MatchBoard", slug: "MatchBoard" },
    { name: "PegelTracker", slug: "PegelTracker" },
    { name: "DailyMind", slug: "DailyMind" },
    { name: "Muenzwurf", slug: "Muenzwurf" },
    { name: "QuickTools", slug: "QuickTools" }
  ];

  async function loadLiveTokens() {
    document.getElementById('statusText').textContent = 'Analysiere CSS-Quellen von GitHub...';
    
    const results = await Promise.all(repos.map(async repo => {
      let manifestData = null, cssText = '', sourceFound = '', activeBranch = 'main';
      
      for (const branch of ['main', 'master']) {
        try {
          // 1. Manifest laden
          const mRes = await fetch(`https://raw.githubusercontent.com/mvs2-bot/${repo.slug}/${branch}/manifest.json`);
          if (mRes.ok) manifestData = await mRes.json();
          
          // 2. Zuerst versuchen, shared/style.css zu laden
          const cssRes = await fetch(`https://raw.githubusercontent.com/mvs2-bot/${repo.slug}/${branch}/shared/style.css`);
          if (cssRes.ok) {
            const text = await cssRes.text();
            if (text.includes('--p1')) {
              cssText = text;
              sourceFound = 'shared/style.css';
              activeBranch = branch;
              break;
            }
          }
          
          // 3. Fallback: index.html laden
          const hRes = await fetch(`https://raw.githubusercontent.com/mvs2-bot/${repo.slug}/${branch}/index.html`);
          if (hRes.ok) {
            const text = await hRes.text();
            if (text.includes('--p1') || !cssText) {
              cssText = text;
              sourceFound = 'index.html';
              activeBranch = branch;
              break;
            }
          }
        } catch (e) {}
      }

      // Regex Parser für --p1 (unterstützt Light & Dark Modi via data-theme oder .dark)
      let p1Light = '#0066cc';
      let p1Dark = '#409cff';

      if (cssText) {
        const parts = cssText.split(/data-theme=["']dark["']|\.dark/i);
        const lightMatch = parts[0].match(/--p1:\s*([^;}\s]+)/);
        if (lightMatch) p1Light = lightMatch[1].trim();

        if (parts.length > 1) {
          const darkMatch = parts[1].match(/--p1:\s*([^;}\s]+)/);
          if (darkMatch) p1Dark = darkMatch[1].trim();
        }
      }

      const iconSrc = manifestData && manifestData.icons && manifestData.icons[0] ? manifestData.icons[0].src : null;

      return {
        name: repo.name,
        url: `https://github.com/mvs2-bot/${repo.slug}`,
        liveName: manifestData ? (manifestData.short_name || manifestData.name) : repo.name,
        p1Light,
        p1Dark,
        icon: iconSrc ? `https://raw.githubusercontent.com/mvs2-bot/${repo.slug}/${activeBranch}/${iconSrc}` : null,
        status: sourceFound ? `Live (${sourceFound})` : 'Fallback',
        ok: !!sourceFound
      };
    }));

    document.getElementById('statusText').textContent = `Live synchronisiert (${results.filter(r=>r.ok).length}/8 Repos)`;
    render(results);
  }

  function render(data) {
    document.getElementById('matrixTable').innerHTML = data.map(r => `
      <tr>
        <td>
          <a href="${r.url}" target="_blank" style="color: var(--ink); text-decoration: none; font-weight: 600; display: flex; align-items: center; gap: 8px;">
            ${r.icon ? `<img src="${r.icon}" style="width:24px; height:24px; border-radius:6px; object-fit:cover;">` : ''}
            <span>${r.liveName}</span>
          </a>
        </td>
        <td>
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="width:12px; height:12px; border-radius:50%; background:${r.p1Light}; display:inline-block; border:1px solid rgba(0,0,0,0.1)"></span>
            <code style="font-size:12px;">${r.p1Light}</code>
          </div>
        </td>
        <td>
          <div style="display:flex; align-items:center; gap:6px;">
            <span style="width:12px; height:12px; border-radius:50%; background:${r.p1Dark}; display:inline-block; border:1px solid rgba(255,255,255,0.2)"></span>
            <code style="font-size:12px;">${r.p1Dark}</code>
          </div>
        </td>
        <td><span class="badge" style="background: ${r.ok ? 'var(--ok-soft)' : 'var(--danger-soft)'}; color: ${r.ok ? 'var(--ok)' : 'var(--danger)'};">${r.status}</span></td>
      </tr>
    `).join('');

    document.getElementById('cardsGrid').innerHTML = data.map(r => `
      <div class="repo-card">
        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
          <div style="display:flex; gap:10px; align-items:center;">
            ${r.icon ? `<img src="${r.icon}" style="width:36px; height:36px; border-radius:10px; object-fit:cover;">` : ''}
            <div>
              <div style="font-weight:600; font-size:14px; color: var(--ink);">${r.liveName}</div>
              <a href="${r.url}" target="_blank" style="font-size:11px; color:var(--mute); text-decoration:none;">GitHub Repo ↗</a>
            </div>
          </div>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 8px;">
          <div style="background:var(--well); padding:8px; border-radius:8px; font-size:11px;">
            <div style="color:var(--mute);">Light (--p1)</div>
            <code style="font-weight:600; color:var(--ink);">${r.p1Light}</code>
          </div>
          <div style="background:var(--well); padding:8px; border-radius:8px; font-size:11px;">
            <div style="color:var(--mute);">Dark (--p1)</div>
            <code style="font-weight:600; color:var(--ink);">${r.p1Dark}</code>
          </div>
        </div>
      </div>
    `).join('');
  }

  const themeBtn = document.getElementById('themeBtn');
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    themeBtn.innerHTML = t === 'dark' ? '<svg class="ic" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2.5v2M12 19.5v2M4.6 4.6l1.4 1.4M18 18l1.4 1.4M2.5 12h2M19.5 12h2M4.6 19.4 6 18M18 6l1.4-1.4"/></svg>' : '<svg class="ic" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>';
    try { localStorage.setItem('overall-theme', t); } catch (e) {}
  }
  themeBtn.addEventListener('click', () => {
    applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
  });
  applyTheme(document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark');

  loadLiveTokens();
</script>
</body>
</html>
