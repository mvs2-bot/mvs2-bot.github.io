<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>mvs2 · Dashboard</title>
<meta name="description" content="Persönliches Dashboard mit allen Projekten">
<meta name="theme-color" content="#f4f6fb">
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" href="icons/favicon-32.png" type="image/png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" sizes="180x180">
<link rel="manifest" href="manifest.json">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="shared/overall-account.js"></script>
<script>
  // Theme vor dem ersten Rendern setzen (kein Aufblitzen). Standard: hell.
  (function () {
    var t = 'light';
    try { t = localStorage.getItem('dash-theme') || 'light'; } catch (e) {}
    document.documentElement.setAttribute('data-theme', t);
  })();
</script>
<style>
  :root {
    --bg: #f4f6fb;
    --bg-grad: radial-gradient(1200px 600px at 10% -10%, #dbe7ff 0%, transparent 60%),
               radial-gradient(900px 500px at 110% 10%, #e7f7ef 0%, transparent 55%);
    --card: #ffffff;
    --card-hover: #f8faff;
    --border: #e2e8f0;
    --text: #0f172a;
    --muted: #64748b;
    --accent: #2563eb;
    --shadow: 0 1px 2px rgba(15,23,42,.06), 0 4px 16px rgba(15,23,42,.06);
    /* Namen, die das gemeinsame Konto-Modul (shared/overall-account.js) erwartet */
    --line: var(--border); --ink: var(--text); --mute: var(--muted); --p1: var(--accent); --hover: var(--card-hover); --danger: #dc2626;
  }
  /* Dunkel: für AMOLED optimiert – echtes Schwarz, keine Verläufe, Karten nur über dünne Ränder abgesetzt */
  [data-theme="dark"] {
    --bg: #000000;
    --bg-grad: none;
    --card: #000000;
    --card-hover: #0d0d0d;
    --border: #262626;
    --text: #e5e5e5;
    --muted: #8a8a8a;
    --accent: #60a5fa;
    --shadow: none;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    background: var(--bg-grad), var(--bg);
    background-attachment: fixed;
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px 48px; }

  header {
    position: sticky; top: 0; z-index: 10;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    background: color-mix(in srgb, var(--bg) 78%, transparent);
    border-bottom: 1px solid var(--border);
  }
  .bar { max-width: 880px; margin: 0 auto; padding: 12px 16px; display: flex; align-items: center; gap: 12px; }
  .bar img { width: 32px; height: 32px; }
  .bar .title { font-weight: 700; font-size: 1.05rem; letter-spacing: .2px; }
  .bar .spacer { flex: 1; }
  .icon-btn {
    border: 1.5px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 10px; padding: 7px 10px; font-size: 1.2rem; line-height: 1; cursor: pointer;
  }
  .icon-btn:hover { background: var(--card-hover); }

  .icon-btn svg { width: 1.2rem; height: 1.2rem; display: block; }

  .hero { padding: 18px 0 2px; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px 20px; flex-wrap: wrap; }
  .hero h1 { margin: 0 0 2px; font-size: clamp(1.4rem, 4vw, 1.8rem); }
  .hero p { margin: 0; color: var(--muted); }
  .clock { font-size: clamp(1.4rem, 4vw, 1.8rem); font-weight: 650; font-variant-numeric: tabular-nums; letter-spacing: .02em; line-height: 1.2; }

  /* Suchfenster */
  .search-dlg {
    width: min(560px, calc(100vw - 32px)); max-height: min(70vh, 560px);
    margin: 10vh auto auto; padding: 0; border: 1px solid var(--border); border-radius: 16px;
    background: var(--card); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); overflow: hidden;
  }
  .search-dlg[open] { display: flex; flex-direction: column; }
  .search-dlg::backdrop { background: rgba(2,6,23,.55); backdrop-filter: blur(3px); -webkit-backdrop-filter: blur(3px); }
  .search-dlg .field { position: relative; border-bottom: 1px solid var(--border); }
  .search-dlg .field svg { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .search-dlg input {
    width: 100%; padding: 16px 16px 16px 44px; font-size: 1.05rem;
    border: 0; background: transparent; color: var(--text); outline: none;
  }
  .search-dlg .results { overflow-y: auto; padding: 6px; }
  .search-dlg .hit {
    display: flex; gap: 12px; align-items: center; padding: 8px 10px; border-radius: 10px;
    color: inherit; text-decoration: none;
  }
  .search-dlg .hit.sel, .search-dlg .hit:hover { background: var(--card-hover); outline: 1.5px solid var(--accent); }
  .search-dlg .hit .ico { flex: 0 0 36px; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; font-size: 1.2rem; }
  .search-dlg .hit .ico svg { width: 22px; height: 22px; }
  .search-dlg .hit .name { font-weight: 600; }
  .search-dlg .hit .desc { color: var(--muted); font-size: .85rem; }
  .search-dlg .none { color: var(--muted); padding: 12px 10px; }

  h2.section { font-size: .8rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 20px 0 10px; font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
  .tile {
    display: flex; flex-direction: column; gap: 10px;
    padding: 14px; border-radius: 16px; color: inherit;
    background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow);
    transition: transform .12s ease, background .12s ease, border-color .12s ease;
  }
  .tile:hover { transform: translateY(-2px); background: var(--card-hover); border-color: var(--accent); }
  .tile:active { transform: translateY(0); }
  .tile .main { flex: 1; min-width: 0; display: flex; gap: 14px; align-items: center; text-decoration: none; color: inherit; }
  .tile .gh {
    flex: 0 0 auto; display: grid; place-items: center; width: 38px; height: 38px;
    border-radius: 10px; border: 1.5px solid var(--border); color: var(--muted); text-decoration: none;
    transition: color .12s ease, border-color .12s ease, background .12s ease;
  }
  .tile .gh:hover { color: var(--text); border-color: var(--accent); background: var(--card); }
  .tile .gh svg { width: 20px; height: 20px; }
  .tile .gh { position: relative; }
  .tile .fav { background: transparent; cursor: pointer; padding: 0; font: inherit; width: 30px; border-color: transparent; }
  .tile .fav:hover { background: transparent; border-color: transparent; color: #f59e0b; }
  .tile .fav.on { color: #f59e0b; }
  .tile .fav.on svg { fill: currentColor; }
  /* Supabase-Status: grau = wird geprüft/offline, grün = erreichbar, rot = pausiert/nicht erreichbar */
  .tile .gh .dot {
    position: absolute; top: -4px; right: -4px; width: 11px; height: 11px; border-radius: 50%;
    background: #94a3b8; border: 2px solid var(--card);
  }
  .tile .gh .dot.ok { background: #16a34a; }
  .tile .gh .dot.bad { background: #dc2626; }
  /* Fußzeile: links „Geändert vor …“, rechts Stern / GitHub / Supabase – so behält der Text die volle Breite */
  .tile .foot { display: flex; align-items: center; gap: 6px; padding-top: 10px; border-top: 1px solid var(--border); }
  .tile .foot .gh { width: 34px; height: 34px; }
  .tile .foot .gh svg { width: 18px; height: 18px; }
  .tile .meta { flex: 1; min-width: 0; color: var(--muted); font-size: .75rem; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tile .ico {
    flex: 0 0 52px; width: 52px; height: 52px; border-radius: 14px;
    display: grid; place-items: center; font-size: 1.7rem;
  }
  .tile .ico svg { width: 30px; height: 30px; }
  .tile .txt { min-width: 0; }
  .tile .name { font-weight: 650; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .tile .desc { color: var(--muted); font-size: .88rem; margin-top: 2px; hyphens: auto; overflow-wrap: anywhere; }
  .badge { font-size: .68rem; font-weight: 600; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }

  /* Fußzeile & Schnellstart-Leiste */
  footer { margin-top: 36px; color: var(--muted); font-size: .8rem; text-align: center; }
  .footer-links {
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 14px;
  }
  .quick-btn {
    display: grid;
    place-items: center;
    width: 36px;
    height: 36px;
    border-radius: 10px;
    border: 1.5px solid var(--border);
    background: var(--card);
    color: var(--muted);
    text-decoration: none;
    transition: color .12s ease, border-color .12s ease, background .12s ease, transform .12s ease;
  }
  .quick-btn:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--card-hover);
    transform: translateY(-2px);
  }
  .quick-btn svg {
    width: 18px;
    height: 18px;
    fill: currentColor;
  }

  /* Login-Pflicht: bis die Anmeldung geprüft ist, sieht man nur die Anmeldekarte */
  body:not(.unlocked) main.wrap, body:not(.unlocked) #searchBtn, body:not(.signed-in) #profileBtn { display: none; }
  body.unlocked #gate { display: none; }
  #gate { max-width: 380px; margin: 12vh auto 0; padding: 0 16px; }
  .gate-card { padding: 22px; border-radius: 16px; background: var(--card); border: 1px solid var(--border); box-shadow: var(--shadow); }
  .gate-card h1 { margin: 0 0 4px; font-size: 1.3rem; }
  .gate-card p { margin: 0 0 16px; color: var(--muted); font-size: .92rem; }
  .gate-card label { display: block; font-size: .85rem; color: var(--muted); margin-bottom: 12px; }
  .gate-card input {
    display: block; width: 100%; margin-top: 4px; padding: 10px 12px; font: inherit; font-size: 1rem;
    border: 1.5px solid var(--border); border-radius: 10px; background: var(--bg); color: var(--text);
  }
  .gate-card input:focus { outline: none; border-color: var(--accent); }
  .gate-card .btn {
    width: 100%; padding: 11px; font: inherit; font-weight: 600; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  .gate-card .btn:disabled { opacity: .6; cursor: default; }
  .gate-card .btn.ghost { background: transparent; color: var(--text); border: 1.5px solid var(--border); }
  .gate-card .link { display: inline-block; margin-top: 12px; padding: 0; border: 0; background: none; font: inherit; font-size: .85rem; color: var(--accent); cursor: pointer; }
  .gate-msg { margin: 12px 0 0; font-size: .88rem; color: #dc2626; }
  .gate-msg.ok { color: #16a34a; }

  /* Profilbild oben rechts + Menü */
  #profileBtn { display: inline-flex; align-items: center; justify-content: center; width: 40px; height: 38px; padding: 0; overflow: hidden; font-size: 1.15rem; }
  #profileBtn.has-photo { border-radius: 50%; width: 38px; }
  #profileBtn img, .pm-ava img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pm-menu {
    position: fixed; z-index: 30; min-width: 250px; max-width: calc(100vw - 20px); padding: 6px;
    background: var(--card); color: var(--text); border: 1px solid var(--border); border-radius: 14px;
    box-shadow: 0 12px 32px rgba(15,23,42,.22);
  }
  .pm-menu[hidden] { display: none; }
  .pm-head { display: flex; gap: 10px; align-items: center; padding: 8px 10px 12px; margin-bottom: 4px; border-bottom: 1px solid var(--border); }
  .pm-head b { display: block; font-size: .95rem; }
  .pm-head small { display: block; color: var(--muted); font-size: .78rem; word-break: break-all; }
  .pm-ava { flex: 0 0 42px; width: 42px; height: 42px; border-radius: 50%; overflow: hidden; display: grid; place-items: center; font-size: 1.3rem; background: var(--card-hover); border: 1px solid var(--border); }
  .pm-item {
    display: flex; width: 100%; align-items: center; gap: 10px; padding: 10px 12px; border: 0; border-radius: 8px;
    background: none; color: var(--text); font: inherit; font-size: .92rem; font-weight: 600; text-align: left; text-decoration: none; cursor: pointer;
  }
  .pm-item:hover, .pm-item:focus-visible { background: var(--card-hover); outline: none; }
  .pm-item small { margin-left: auto; color: var(--muted); font-weight: 500; font-size: .72rem; }
  .pm-item.danger { color: #dc2626; }
  .pm-sep { height: 1px; margin: 4px 6px; background: var(--border); }
</style>
</head>
<body>

<header>
  <div class="bar">
    <img src="icon.svg" alt="">
    <span class="title">mvs2</span>
    <span class="spacer"></span>
    <button class="icon-btn" id="searchBtn" aria-label="Projekt suchen" title="Suchen (/)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button>
    <button class="icon-btn" id="themeBtn" aria-label="Hell/Dunkel umschalten" title="Hell/Dunkel">🌙</button>
    <button class="icon-btn" id="profileBtn" type="button" aria-label="Konto-Menü öffnen" aria-haspopup="menu" aria-expanded="false">👤</button>
  </div>
</header>

<section id="gate" aria-live="polite">
  <div class="gate-card" id="gateBusy">
    <p style="margin:0">Anmeldung wird geprüft …</p>
  </div>
  <form class="gate-card" id="loginForm" hidden>
    <h1>Anmelden</h1>
    <p>Das Dashboard ist nur mit Konto erreichbar (dasselbe wie bei TravelBase und Quest Log).</p>
    <label>E-Mail<input type="email" id="loginEmail" autocomplete="username" required></label>
    <label>Passwort<input type="password" id="loginPassword" autocomplete="current-password" required></label>
    <button class="btn" type="submit">Anmelden</button>
    <button class="link" type="button" id="resetBtn">Passwort vergessen?</button>
    <p class="gate-msg" id="loginMsg" hidden></p>
  </form>
  <div class="gate-card" id="noAccess" hidden>
    <h1>Kein Zugang</h1>
    <p>Dein Konto <b id="noAccessEmail"></b> hat keinen Zugang zum Dashboard. Ein Admin kann ihn in der Verwaltung freischalten.</p>
    <button class="btn ghost" type="button" id="noAccessLogout">Abmelden</button>
  </div>
</section>

<main class="wrap">
  <section class="hero">
    <div>
      <h1 id="greeting">Hallo!</h1>
      <p id="today"></p>
    </div>
    <time class="clock" id="clock"></time>
  </section>

  <div id="sections"></div>

  <footer>
    <div class="footer-links">
      <!-- Claude -->
      <a class="quick-btn" href="https://claude.ai/new" target="_blank" rel="noopener" aria-label="Claude" title="Claude">
        <svg viewBox="0 0 24 24"><path d="M18.73 5.42h-3.15l-3.58 8.65L8.42 5.42H5.27l5.22 12.02h2.82l5.42-12.02zM3.73 13.77h2.15v-1.8H3.73v1.8zm0 3.67h2.15v-1.8H3.73v1.8zm0-7.34h2.15V8.3H3.73v1.8z"/></svg>
      </a>
      <!-- Gemini -->
      <a class="quick-btn" href="https://gemini.google.com/app?utm_source=app_launcher&utm_medium=owned&utm_campaign=base_all" target="_blank" rel="noopener" aria-label="Gemini" title="Gemini">
        <svg viewBox="0 0 24 24"><path d="M12 0C10.8 6.4 7.4 9.8 1 11c6.4 1.2 9.8 4.6 11 11 1.2-6.4 4.6-9.8 11-11-6.4-1.2-9.8-4.6-11-11z"/></svg>
      </a>
      <!-- Spotify -->
      <a class="quick-btn" href="https://open.spotify.com/intl-de" target="_blank" rel="noopener" aria-label="Spotify" title="Spotify">
        <svg viewBox="0 0 24 24"><path d="M12 0C5.4 0 0 5.4 0 12s5.4 12 12 12 12-5.4 12-12S18.6 0 12 0zm5.521 17.34c-.24.359-.72.48-1.08.24-2.999-1.83-6.78-2.24-11.22-1.23-.42.12-.84-.18-.96-.6-.12-.42.18-.84.6-.96 4.86-1.11 9.06-.66 12.48 1.44.36.24.48.72.24 1.11zm1.47-3.84c-.3.48-.91.63-1.39.33-3.42-2.1-8.64-2.72-12.66-1.49-.54.16-1.12-.13-1.28-.67-.16-.54.13-1.12.67-1.28 4.62-1.41 10.35-.72 14.37 1.77.48.3.63.91.33 1.39zm.12-4.02C14.01 7.14 7.26 6.9 4.35 7.77c-.63.19-1.3-.16-1.49-.79-.19-.63.16-1.3.79-1.49 3.42-1.02 10.86-.75 15.39 1.89.57.33.75 1.08.42 1.65-.33.57-1.08.75-1.65.42z"/></svg>
      </a>
      <!-- WhatsApp Web -->
      <a class="quick-btn" href="https://web.whatsapp.com" target="_blank" rel="noopener" aria-label="WhatsApp Web" title="WhatsApp Web">
        <svg viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.148-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.124-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.096 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
      </a>
      <!-- Google Suche -->
      <a class="quick-btn" href="https://www.google.com" target="_blank" rel="noopener" aria-label="Google" title="Google">
        <svg viewBox="0 0 24 24"><path d="M12.24 10.285V13.5h6.806c-.275 1.765-2.056 5.174-6.806 5.174-4.095 0-7.439-3.389-7.439-7.574s3.344-7.574 7.439-7.574c2.33 0 3.891.989 4.785 1.849l3.254-3.138C18.189 1.186 15.479 0 12.24 0 5.48 0 0 5.48 0 12.24s5.48 12.24 12.24 12.24c7.058 0 11.734-4.966 11.734-11.96 0-.828-.082-1.458-.182-2.235H12.24z"/></svg>
      </a>
      <!-- Google Notizen (Keep) -->
      <a class="quick-btn" href="https://keep.google.com" target="_blank" rel="noopener" aria-label="Google Notizen" title="Google Notizen">
        <svg viewBox="0 0 24 24"><path d="M6 2C4.9 2 4 2.9 4 4v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6H6zm7 1.5L18.5 9H13V3.5zM8 12h8v2H8v-2zm0 4h5v2H8v-2z"/></svg>
      </a>
      <!-- Google Drive -->
      <a class="quick-btn" href="https://drive.google.com" target="_blank" rel="noopener" aria-label="Google Drive" title="Google Drive">
        <svg viewBox="0 0 24 24"><path d="M7.71 3.5L1.15 15h6.56l6.56-11.5H7.71zM8.91 3.5l6.56 11.5h6.56L15.47 3.5H8.91zM3.48 16.5l3.28 5.75h13.12l-3.28-5.75H3.48z"/></svg>
      </a>

<script>
/* ================================================================
   PROJEKTE – hier pflegen.
   Neues Projekt = neuen Eintrag ins passende Array kopieren.
   icon: Emoji ODER Schlüssel aus ICONS (unten)
   color: Hintergrundfarbe der Icon-Kachel

   supabase: optional, Supabase-Projekt-ID → zusätzlicher Button zum Supabase-Dashboard
   supabaseKey: optional, öffentlicher Publishable Key → Statuspunkt (erreichbar / pausiert)
   ================================================================ */
const SECTIONS = [
  {
    title: 'Reisen',
    items: [
      { name: 'TravelBase',  desc: 'Alle Reiseplanungen an einem Ort', url: '/TravelBase/',  icon: 'globePin', color: '#2563eb', badge: 'Login', supabase: 'syaonnedmidaipwjjmio', supabaseKey: 'sb_publishable_a3tggKZJmotlFtIqKKdSYg_cNsazRkX' },
      { name: 'Quick-Tools', desc: 'Währung, Phrasen, GPS & Notfall pro Land', url: '/QuickTools/', icon: 'tools', color: '#0d9488' },
    ]
  },
  {
    title: 'Projekte & Tools',
    items: [
      { name: 'Camper-Namenssuche', desc: 'Namen für den Bus vorschlagen & abstimmen', url: '/Spitznamensuche-Camper/', icon: 'camper', color: '#ea580c' },
      { name: 'Münzwurf',           desc: 'Entscheidungshilfe: A oder B?',             url: '/Muenzwurf/',            icon: 'coin',   color: '#ca8a04' },
      { name: 'Quest Log',          desc: 'The Real World: 100 Quests, Level & Titel',  url: '/RealWorld-Questlog/',    icon: 'quest',  color: '#7c3aed', badge: 'Login', supabase: 'syaonnedmidaipwjjmio', supabaseKey: 'sb_publishable_a3tggKZJmotlFtIqKKdSYg_cNsazRkX' },
    ]
  },
];

const GITHUB_USER = 'mvs2-bot';
const repoName = it => it.repo || String(it.url).split('/').filter(Boolean)[0] || '';
const repoUrl = it => {
  const name = repoName(it);
  return name ? `https://github.com/${GITHUB_USER}/${name}` : '';
};
const GH_ICON = '<svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg>';

const STAR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="m12 3.5 2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8-4.3-4.1 5.9-.9z"/></svg>';

const SB_ICON = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.2 2.3c.5-.6 1.5-.3 1.5.5v7.7h6.4c.8 0 1.3 1 .8 1.6l-9.1 9.6c-.5.6-1.5.3-1.5-.5v-7.7H4.9c-.8 0-1.3-1-.8-1.6z"/></svg>';

const ICONS = {
  globePin: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.8 3.8 5.8 3.8 9s-1.3 6.2-3.8 9c-2.5-2.8-3.8-5.8-3.8-9S9.5 5.8 12 3z"/></svg>',
  tools:    '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>',
  camper:   '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 6.5 9 4h6l4 2.5"/><path d="M3 16V9a2 2 0 0 1 2-2h11l4 4v5h-1"/><path d="M3 16h2m4 0h6"/><circle cx="7" cy="16.5" r="1.8"/><circle cx="17" cy="16.5" r="1.8"/><path d="M14 7v4h6"/></svg>',
  quest:    '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 4h11v13a3 3 0 0 1-3 3H7"/><path d="M8 4a2 2 0 0 0-2 2v11a3 3 0 0 1-3-3v-1h3"/><path d="m10 10 2 2 4-4M10 15h5"/></svg>',
  coin:     '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="12" rx="8" ry="9"/><path d="M12 7.5v9M9.5 9.5c0-1 1.1-1.7 2.5-1.7s2.5.7 2.5 1.6c0 2.3-5 1.2-5 3.6 0 1 1.1 1.7 2.5 1.7s2.5-.7 2.5-1.7"/></svg>',
};

/* ---------------- Rendering ---------------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const iconHtml = it => ICONS[it.icon] || esc(it.icon);

/* ---------------- Favoriten (Stern, nur lokal auf diesem Gerät) ---------------- */
const FAV_KEY = 'dash-favs';
try { localStorage.removeItem('dash-usage'); } catch (e) {} // Altlast von „Häufig benutzt“
let favs = [];
try { favs = JSON.parse(localStorage.getItem(FAV_KEY)) || []; } catch (e) {}
const isFav = it => favs.includes(it.url);
function toggleFav(url) {
  favs = favs.includes(url) ? favs.filter(u => u !== url) : favs.concat(url);
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favs)); } catch (e) {}
  render();
}

function tileHtml(it) {
  const ico = iconHtml(it);
  const gh = repoUrl(it);
  return `
        <div class="tile">
          <a class="main" href="${esc(it.url)}">
            <span class="ico" style="background:${esc(it.color || '#334155')}">${ico}</span>
            <span class="txt">
              <span class="name">${esc(it.name)}${it.badge ? `<span class="badge">${esc(it.badge)}</span>` : ''}</span>
              <span class="desc">${esc(it.desc)}</span>
            </span>
          </a>
          <div class="foot">
          <span class="meta" data-repo="${esc(repoName(it))}"></span>
          <button class="gh fav${isFav(it) ? ' on' : ''}" type="button" data-fav="${esc(it.url)}" aria-pressed="${isFav(it)}" aria-label="${esc(it.name)} ${isFav(it) ? 'aus Favoriten entfernen' : 'zu Favoriten'}" title="${isFav(it) ? 'Aus Favoriten entfernen' : 'Als Favorit oben anheften'}">${STAR_ICON}</button>
          ${gh ? `<a class="gh" href="${esc(gh)}" target="_blank" rel="noopener" aria-label="${esc(it.name)} auf GitHub" title="Repo auf GitHub">${GH_ICON}</a>` : ''}
          ${it.supabase ? `<a class="gh" href="https://supabase.com/dashboard/project/${esc(it.supabase)}" target="_blank" rel="noopener" aria-label="${esc(it.name)} in Supabase" title="Supabase-Dashboard">${SB_ICON}${it.supabaseKey ? `<span class="dot" data-sb="${esc(it.supabase)}"></span>` : ''}</a>` : ''}
          </div>
        </div>`;
}

function render() {
  const host = document.getElementById('sections');
  // Favoriten stehen oben (in der Reihenfolge, in der sie markiert wurden) und fehlen dafür in ihrer Gruppe
  const all = SECTIONS.flatMap(sec => sec.items);
  const top = favs.map(u => all.find(it => it.url === u)).filter(Boolean);
  const groups = [{ title: 'Favoriten', items: top }]
    .concat(SECTIONS.map(sec => ({ title: sec.title, items: sec.items.filter(it => !isFav(it)) })));
  let html = '';
  for (const sec of groups) {
    if (!sec.items.length) continue;
    html += `<h2 class="section">${esc(sec.title)}</h2><div class="grid">`;
    for (const it of sec.items) html += tileHtml(it);
    html += `</div>`;
  }
  host.innerHTML = html;
  paintPushed();
  paintStatus();
}

/* ---------------- Letzte Änderung (GitHub, 15 Min. zwischengespeichert) ---------------- */
const PUSH_KEY = 'dash-pushed';
const PUSH_TTL = 15 * 60 * 1000;
let pushed = {};
try { pushed = (JSON.parse(localStorage.getItem(PUSH_KEY)) || {}).repos || {}; } catch (e) {}

const rtf = new Intl.RelativeTimeFormat('de', { numeric: 'auto', style: 'short' });
function ago(iso) {
  const sec = (new Date(iso) - Date.now()) / 1000;
  const steps = [[60, 'second'], [60, 'minute'], [24, 'hour'], [7, 'day'], [4.35, 'week'], [12, 'month'], [Infinity, 'year']];
  let v = sec;
  for (const [n, unit] of steps) {
    if (Math.abs(v) < n) return unit === 'second' ? 'gerade eben' : rtf.format(Math.round(v), unit);
    v /= n;
  }
}
function paintPushed() {
  document.querySelectorAll('.meta[data-repo]').forEach(el => {
    const iso = pushed[el.dataset.repo];
    el.textContent = iso ? 'Geändert ' + ago(iso) : '';
    el.title = iso ? new Date(iso).toLocaleString('de-DE') : '';
  });
}
async function loadPushed() {
  try {
    const c = JSON.parse(localStorage.getItem(PUSH_KEY));
    if (c && Date.now() - c.at < PUSH_TTL) return;
  } catch (e) {}
  try {
    const res = await fetch(`https://api.github.com/users/${GITHUB_USER}/repos?per_page=100`, { headers: { Accept: 'application/vnd.github+json' } });
    if (!res.ok) return;
    const repos = {};
    for (const r of await res.json()) repos[r.name] = r.pushed_at;
    pushed = repos;
    try { localStorage.setItem(PUSH_KEY, JSON.stringify({ at: Date.now(), repos })); } catch (e) {}
    paintPushed();
  } catch (e) {}
}

/* ---------------- Supabase-Status ---------------- */
const sbStatus = {}; // id → 'ok' | 'bad'
function paintStatus() {
  document.querySelectorAll('.dot[data-sb]').forEach(el => {
    const st = sbStatus[el.dataset.sb];
    el.className = 'dot' + (st ? ' ' + st : '');
    el.parentElement.title = st === 'ok' ? 'Supabase: erreichbar' : st === 'bad' ? 'Supabase: pausiert oder nicht erreichbar' : 'Supabase-Dashboard';
  });
}
async function checkSupabase() {
  if (!navigator.onLine) return;
  const items = SECTIONS.flatMap(sec => sec.items).filter(it => it.supabase && it.supabaseKey);
  await Promise.all(items.map(async it => {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      const res = await fetch(`https://${it.supabase}.supabase.co/auth/v1/health`, { headers: { apikey: it.supabaseKey }, signal: ctl.signal, cache: 'no-store' });
      sbStatus[it.supabase] = res.ok ? 'ok' : 'bad';
    } catch (e) {
      sbStatus[it.supabase] = navigator.onLine ? 'bad' : undefined;
    } finally {
      clearTimeout(timer);
    }
  }));
  paintStatus();
}

/* ---------------- Login-Pflicht (Supabase-Core-Projekt, gemeinsame Konten aller Apps) ----------------
   Hinein darf, wer im Core-Projekt globaler Admin ist oder für die App "dashboard" mindestens
   die Rolle member hat (overall_app_access, vergeben in der Verwaltung). Gäste bleiben draußen.
   Gleiche Domain wie TravelBase und Quest Log: wer dort angemeldet ist, ist es hier auch. */
const CORE = { url: 'https://syaonnedmidaipwjjmio.supabase.co', key: 'sb_publishable_a3tggKZJmotlFtIqKKdSYg_cNsazRkX' };
const ACCESS_KEY = 'dash-access'; // User-ID der letzten erfolgreichen Prüfung, damit das Dashboard offline aufgeht
const sb = window.supabase ? window.supabase.createClient(CORE.url, CORE.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true } }) : null;
let started = false;

function startDashboard() {
  document.body.classList.add('unlocked');
  if (started) return;
  started = true;
  render();
  loadPushed();
  checkSupabase();
}

/* ---------------- Profilbild oben rechts + Menü ----------------
   Bild und Name aus overall_profiles (gilt für alle Apps), Dialoge aus shared/overall-account.js.
   Admin-Einstellungen nur für globale Admins; vorerst die Verwaltung in TravelBase. */
const profileMenu = (() => {
  const btn = document.getElementById('profileBtn');
  const ADMIN_URL = '/TravelBase/verwaltung.html';
  const CACHE_KEY = 'dash-profile';
  let user = null, profile = {}, photo = null, menu = null, onLogout = () => {};

  const shownName = () => (profile.display_name || '').trim() || (user && user.email) || '';
  const avatarHtml = () => photo ? `<img src="${photo}" alt="">` : '👤';
  const save = () => { try { localStorage.setItem(CACHE_KEY, JSON.stringify({ id: user.id, profile, photo })); } catch (e) {} };
  const load = id => { try { const c = JSON.parse(localStorage.getItem(CACHE_KEY)); return c && c.id === id ? c : null; } catch (e) { return null; } };

  function paint() {
    btn.innerHTML = avatarHtml();
    btn.classList.toggle('has-photo', !!photo);
    btn.title = shownName();
    // Begrüßung mit Vornamen (die Uhr aktualisiert sie jede Sekunde)
    window.dashUserName = (profile.display_name || '').trim().split(/\s+/)[0] || '';
    if (menu && !menu.hidden) renderMenu();
  }

  function renderMenu() {
    menu.innerHTML = `
      <div class="pm-head">
        <span class="pm-ava">${avatarHtml()}</span>
        <div><b>${esc(shownName())}</b><small>${esc(user.email)}</small></div>
      </div>
      <button class="pm-item" type="button" role="menuitem" data-act="settings">⚙️ Kontoeinstellungen</button>
      <button class="pm-item" type="button" role="menuitem" data-act="password">🔑 Passwort ändern</button>
      ${profile.role === 'admin' ? '<a class="pm-item" role="menuitem" href="' + ADMIN_URL + '">🛡️ Admin-Einstellungen<small>nur Admins</small></a>' : ''}
      <div class="pm-sep"></div>
      <button class="pm-item danger" type="button" role="menuitem" data-act="logout">🚪 Abmelden</button>`;
  }

  function open() {
    if (!user) return;
    if (!menu) {
      menu = document.createElement('div');
      menu.className = 'pm-menu'; menu.setAttribute('role', 'menu'); menu.hidden = true;
      menu.addEventListener('click', e => {
        const b = e.target.closest('[data-act]'); if (!b) return;
        close();
        if (b.dataset.act === 'settings') OverallAccount.openSettings({ sb, onChange: p => {
          const { photo: pic, ...row } = p;
          profile = { ...profile, ...row }; photo = pic || null; save(); paint();
        } });
        else if (b.dataset.act === 'password') OverallAccount.openPassword({ sb, redirectTo: location.origin + '/TravelBase/' });
        else if (b.dataset.act === 'logout') onLogout();
      });
      document.body.appendChild(menu);
    }
    renderMenu();
    const r = btn.getBoundingClientRect();
    menu.style.top = (r.bottom + 8) + 'px';
    menu.style.right = Math.max(10, window.innerWidth - r.right) + 'px';
    menu.hidden = false;
    btn.setAttribute('aria-expanded', 'true');
    const first = menu.querySelector('.pm-item'); if (first) first.focus();
  }
  function close() {
    if (menu) menu.hidden = true;
    btn.setAttribute('aria-expanded', 'false');
  }

  btn.addEventListener('click', e => { e.stopPropagation(); (menu && !menu.hidden) ? close() : open(); });
  document.addEventListener('click', e => { if (menu && !menu.hidden && !menu.contains(e.target)) close(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  window.addEventListener('resize', close);

  // Mit dem gespeicherten Stand sofort anzeigen, dann aus der Datenbank nachladen
  async function refresh(session) {
    user = session ? { id: session.user.id, email: session.user.email } : null;
    if (!user) { profile = {}; photo = null; close(); if (window.OverallAccount) OverallAccount.close(); paint(); return; }
    const c = load(user.id);
    profile = (c && c.profile) || {}; photo = (c && c.photo) || null;
    paint();
    try {
      const { data, error } = await sb.from('overall_profiles').select('display_name, avatar_path, role').eq('id', user.id).maybeSingle();
      if (error) throw error;
      const path = data && data.avatar_path;
      if (path !== profile.avatar_path || !photo) photo = path ? await OverallAccount.loadPhoto(sb, path) : null;
      profile = data || {};
      save(); paint();
    } catch (e) { if (navigator.onLine) console.warn('Profil laden', e); }
  }

  return { refresh, setLogout: fn => { onLogout = fn; } };
})();

const gate = (() => {
  const $ = id => document.getElementById(id);
  const msg = (text, ok) => { const el = $('loginMsg'); el.textContent = text || ''; el.className = 'gate-msg' + (ok ? ' ok' : ''); el.hidden = !text; };
  function show(view) {
    document.body.classList.remove('unlocked');
    ['gateBusy', 'loginForm', 'noAccess'].forEach(id => { $(id).hidden = id !== view; });
  }
  function errText(e) {
    const m = String(e && (e.message || e));
    if (/invalid login credentials/i.test(m)) return 'E-Mail oder Passwort ist falsch.';
    if (/email not confirmed/i.test(m)) return 'Die E-Mail-Adresse ist noch nicht bestätigt.';
    if (/rate limit|too many/i.test(m)) return 'Zu viele Versuche, bitte kurz warten.';
    if (!navigator.onLine || /fetch|network|load failed/i.test(m)) return 'Keine Verbindung zum Server. Bist du online?';
    return m;
  }
  const remember = id => { try { id ? localStorage.setItem(ACCESS_KEY, id) : localStorage.removeItem(ACCESS_KEY); } catch (e) {} };
  const remembered = () => { try { return localStorage.getItem(ACCESS_KEY); } catch (e) { return null; } };

  async function check() {
    if (!sb) {
      // supabase-js nicht geladen (offline ohne Cache): nur wer schon einmal geprüft wurde, kommt hinein
      if (remembered()) return startDashboard();
      show('loginForm'); msg('Keine Verbindung zum Server. Bist du online?'); return;
    }
    const { data: { session } } = await sb.auth.getSession();
    document.body.classList.toggle('signed-in', !!session);
    profileMenu.refresh(session);
    if (!session) { remember(null); show('loginForm'); return; }
    try {
      const { data, error } = await sb.rpc('overall_has_app_role', { p_app: 'dashboard', p_min_role: 'member' });
      if (error) throw error;
      if (data) { remember(session.user.id); return startDashboard(); }
      remember(null);
      $('noAccessEmail').textContent = session.user.email;
      show('noAccess');
    } catch (e) {
      if (!navigator.onLine && remembered() === session.user.id) return startDashboard();
      show('loginForm'); msg(errText(e));
    }
  }

  async function logout() {
    remember(null);
    if (sb) await sb.auth.signOut().catch(() => {});
    document.body.classList.remove('signed-in');
    profileMenu.refresh(null);
    show('loginForm'); msg('');
  }

  $('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    if (!sb) return msg('Keine Verbindung zum Server. Bist du online?');
    const btn = e.target.querySelector('button[type="submit"]');
    btn.disabled = true; msg('');
    try {
      const { error } = await sb.auth.signInWithPassword({ email: $('loginEmail').value.trim(), password: $('loginPassword').value });
      if (error) throw error;
      $('loginPassword').value = '';
      show('gateBusy');
      await check();
    } catch (err) { msg(errText(err)); }
    finally { btn.disabled = false; }
  });
  // Der Link führt zu TravelBase: dort ist das Setzen des neuen Passworts schon eingebaut
  $('resetBtn').addEventListener('click', async () => {
    const email = $('loginEmail').value.trim();
    if (!email) { msg('Bitte zuerst die E-Mail-Adresse eintragen.'); $('loginEmail').focus(); return; }
    if (!sb) return msg('Keine Verbindung zum Server. Bist du online?');
    try {
      const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: location.origin + '/TravelBase/' });
      if (error) throw error;
      msg('📧 Falls die Adresse bekannt ist, kommt gleich eine E-Mail mit einem Link.', true);
    } catch (err) { msg(errText(err)); }
  });
  profileMenu.setLogout(logout);
  $('noAccessLogout').addEventListener('click', logout);
  // Ab- oder Anmeldung in einem anderen Tab (auch in TravelBase/Quest Log) gilt sofort auch hier
  if (sb) sb.auth.onAuthStateChange(ev => { if (ev === 'SIGNED_OUT' || ev === 'SIGNED_IN') setTimeout(check, 0); });

  return { check };
})();

/* ---------------- Suche (Lupe / Taste „/“ / Strg+K) ---------------- */
(function () {
  const dlg = document.getElementById('searchDlg');
  const q = document.getElementById('q');
  const box = document.getElementById('results');
  const all = SECTIONS.flatMap(sec => sec.items.map(it => ({ ...it, section: sec.title })));
  let hits = [], sel = 0;

  function update() {
    const f = q.value.trim().toLowerCase();
    hits = all.filter(it => !f || (it.name + ' ' + it.desc + ' ' + it.section).toLowerCase().includes(f));
    sel = Math.min(sel, Math.max(hits.length - 1, 0));
    box.innerHTML = hits.length ? hits.map((it, i) => `
      <a class="hit${i === sel ? ' sel' : ''}" href="${esc(it.url)}">
        <span class="ico" style="background:${esc(it.color || '#334155')}">${iconHtml(it)}</span>
        <span><span class="name">${esc(it.name)}</span><br><span class="desc">${esc(it.desc)}</span></span>
      </a>`).join('') : '<div class="none">Nichts gefunden.</div>';
    const cur = box.querySelector('.hit.sel');
    if (cur) cur.scrollIntoView({ block: 'nearest' });
  }

  function open() {
    if (dlg.open) return;
    q.value = ''; sel = 0; update();
    dlg.showModal();
    q.focus();
  }

  document.getElementById('searchBtn').addEventListener('click', open);
  q.addEventListener('input', () => { sel = 0; update(); });
  q.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown' && hits.length) { sel = (sel + 1) % hits.length; update(); e.preventDefault(); }
    else if (e.key === 'ArrowUp' && hits.length) { sel = (sel - 1 + hits.length) % hits.length; update(); e.preventDefault(); }
    else if (e.key === 'Enter' && hits[sel]) { location.href = hits[sel].url; e.preventDefault(); }
  });
  // Klick auf den abgedunkelten Hintergrund schließt das Fenster
  dlg.addEventListener('click', e => { if (e.target === dlg) dlg.close(); });
  document.addEventListener('keydown', e => {
    if (!document.body.classList.contains('unlocked')) return;
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if ((e.key === '/' && !typing) || (e.key.toLowerCase() === 'k' && (e.ctrlKey || e.metaKey))) { e.preventDefault(); open(); }
  });
})();

/* ---------------- Begrüßung, Datum & Uhrzeit ---------------- */
(function () {
  const greet = document.getElementById('greeting');
  const today = document.getElementById('today');
  const clock = document.getElementById('clock');
  function tick() {
    const now = new Date();
    const h = now.getHours();
    const g = h < 5 ? 'Gute Nacht' : h < 11 ? 'Guten Morgen' : h < 17 ? 'Hallo' : h < 22 ? 'Guten Abend' : 'Gute Nacht';
    greet.textContent = g + (window.dashUserName ? ', ' + window.dashUserName : '') + ' 👋';
    today.textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    clock.textContent = now.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    clock.dateTime = now.toISOString();
    // auf die nächste volle Sekunde ausrichten
    setTimeout(tick, 1000 - now.getMilliseconds() + 5);
  }
  tick();
})();

/* ---------------- Hell/Dunkel ---------------- */
(function () {
  const btn = document.getElementById('themeBtn');
  const meta = document.querySelector('meta[name="theme-color"]');
  function apply(t) {
    document.documentElement.setAttribute('data-theme', t);
    btn.textContent = t === 'dark' ? '☀️' : '🌙';
    meta.setAttribute('content', t === 'dark' ? '#000000' : '#f4f6fb');
  }
  apply(document.documentElement.getAttribute('data-theme') || 'light');
  btn.addEventListener('click', () => {
    const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    apply(t);
    try { localStorage.setItem('dash-theme', t); } catch (e) {}
  });
})();
